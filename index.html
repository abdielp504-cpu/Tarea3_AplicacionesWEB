<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clima</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Cambiar a modo oscuro"
      aria-pressed="false"
    >
      <span id="theme-icon" aria-hidden="true">☾</span>
      <span id="theme-label">Modo oscuro</span>
    </button>

    <h1>Clima</h1>

    <div class="search-area">
      <form id="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="Busca una ciudad..."
          autocomplete="off"
          role="combobox"
          aria-label="Nombre de la ciudad"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="city-suggestions"
        >
        <button type="submit">Buscar</button>
      </form>
      <div id="city-suggestions" class="suggestions" role="listbox" aria-label="Ciudades sugeridas" hidden></div>
    </div>

    <button id="location-button" class="location-button" type="button">
      <span aria-hidden="true">⌖</span>
      Usar mi ubicación actual
    </button>

    <p id="status" class="status" hidden></p>

    <section id="current" class="card" hidden></section>
    <section id="forecast" class="forecast" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
